[project]
name = "audio-reactive-3d"
version = "0.1.0"
description = "Real-time system-audio visualizer rendered with GLSL/ModernGL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "soundcard>=0.4.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "moderngl>=5.10",
    "moderngl-window>=2.4.6",
]

[project.optional-dependencies]
# Optional dev-time GUI overlay (imgui, PyPI distribution of "pyimgui").
# No prebuilt wheels exist yet for Python >= 3.13, so this extra is only
# installable on 3.11/3.12 interpreters; the app must run without it.
gui = [
    "imgui>=2.0.0; python_version < '3.13'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_reactive_3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
